openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_healthCheck
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /minutas/contratos/{id}:
    get:
      operationId: MinutaController_obtenerMinuta
      parameters:
        - name: id
          required: true
          in: path
          description: Id del contrato general (entero positivo)
          schema:
            type: number
      responses:
        '200':
          description: 'Minuta generada: Data trae el PDF en base64'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaMinutaDto'
              example:
                Success: true
                Status: 200
                Message: Minuta generada exitosamente
                Data: JVBERi0xLjcK...
        '400':
          description: El id del contrato no es un entero positivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaMinutaDto'
              example:
                Success: false
                Status: 400
                Message: El id del contrato debe ser un entero positivo
        '404':
          description: >-
            Contrato general no encontrado, o plantilla no configurada para su
            unidad ejecutora y tipo de contrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaMinutaDto'
              example:
                Success: false
                Status: 404
                Message: Contrato general no encontrado
        '422':
          description: >-
            Faltan datos obligatorios (contratista, ordenador, vigencia o
            cláusulas): "Faltan datos: " y la lista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaMinutaDto'
              example:
                Success: false
                Status: 422
                Message: 'Faltan datos: ordenador'
        '500':
          description: Error inesperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaMinutaDto'
              example:
                Success: false
                Status: 500
                Message: Error al generar la minuta
        '502':
          description: >-
            Un servicio no respondió o respondió con error: "Servicio no
            disponible: " y el servicio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaMinutaDto'
              example:
                Success: false
                Status: 502
                Message: 'Servicio no disponible: plantillas_mid (paso 1: HTML)'
      summary: Generación de minuta en PDF (base64)
      tags:
        - Minuta
  /acta-inicio/contratos/{id}:
    get:
      operationId: ActaInicioController_obtenerPrecarga
      parameters:
        - name: id
          required: true
          in: path
          description: Id del contrato general
          schema:
            type: number
      responses:
        '200':
          description: Solicitud procesada correctamente
      summary: Datos precargados del acta de inicio, campos faltantes y prerrequisitos
      tags: &ref_0
        - ActaInicio
    post:
      operationId: ActaInicioController_generar
      parameters:
        - name: id
          required: true
          in: path
          description: Id del contrato general
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerarActaInicioDto'
      responses:
        '201':
          description: Solicitud procesada correctamente
      summary: >-
        Genera el acta de inicio: PDF (base64), registro del acta y contrato en
        ejecución
      tags: *ref_0
  /acta-inicio/contratos/{id}/previsualizacion:
    post:
      operationId: ActaInicioController_previsualizar
      parameters:
        - name: id
          required: true
          in: path
          description: Id del contrato general
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosActaInicioDto'
      responses:
        '201':
          description: Solicitud procesada correctamente
      summary: Vista previa del acta de inicio en PDF (base64)
      tags: *ref_0
  /acta-inicio/{id}:
    get:
      operationId: ActaInicioController_obtenerActaPorContrato
      parameters:
        - name: id
          required: true
          in: path
          description: Id del contrato general
          schema:
            type: number
      responses:
        '200':
          description: Solicitud procesada correctamente
      summary: Acta de inicio registrada para un contrato y su documento
      tags: *ref_0
  /acta-poliza/contratos/{id}:
    get:
      operationId: ActaPolizaController_obtenerActaPoliza
      parameters:
        - name: id
          required: true
          in: path
          description: Id del contrato general
          schema:
            type: number
      responses:
        '200':
          description: Solicitud procesada correctamente
        '400':
          description: Póliza inconsistente
        '404':
          description: Recurso no encontrado
        '500':
          description: Error interno del servidor
        '502':
          description: Servicio dependiente no disponible
      summary: Generación del acta de aprobación de póliza en PDF (base64)
      tags: &ref_1
        - ActaPoliza
  /acta-poliza/contratos/{id}/borrador:
    post:
      operationId: ActaPolizaController_obtenerBorradorActaPoliza
      parameters:
        - name: id
          required: true
          in: path
          description: Id del contrato general
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              example:
                amparos:
                  - id: 1
                    valor: 5000000
                    fecha_inicio: '2024-01-15'
                    fecha_fin: '2025-01-15'
      responses:
        '200':
          description: Borrador generado correctamente
        '400':
          description: Póliza inconsistente
        '404':
          description: Recurso no encontrado
        '502':
          description: Servicio dependiente no disponible
      summary: >-
        Borrador del acta de aprobación de póliza en PDF (base64), con amparos
        aún sin registrar
      tags: *ref_1
info:
  title: Minuta Contractual MID
  description: API
  version: '1.0'
  contact: {}
tags:
  - name: API
    description: ''
servers: []
components:
  schemas:
    RespuestaMinutaDto:
      type: object
      properties:
        Success:
          type: boolean
          example: true
          description: true solo cuando Status es 200
        Status:
          type: number
          example: 200
          enum:
            - 200
            - 400
            - 404
            - 422
            - 500
            - 502
          description: >-
            Resultado: 200 minuta generada; 400 id inválido; 404 contrato o
            plantilla no encontrados; 422 faltan datos obligatorios; 502
            servicio no disponible; 500 error inesperado
        Message:
          type: string
          example: Minuta generada exitosamente
          description: >-
            Mensaje del resultado. En 422: "Faltan datos: " y la lista de
            faltantes; en 502: "Servicio no disponible: " y el servicio
        Data:
          type: string
          example: JVBERi0xLjcK...
          description: PDF de la minuta en base64; solo viene con Status 200
      required:
        - Success
        - Status
        - Message
    PersonaActaDto:
      type: object
      properties:
        nombres_apellidos:
          type: string
          example: Ing. Martha Lucía Ramírez
        cargo:
          type: string
          example: Director de Obra
        especialidad:
          type: string
          example: Ingeniería Civil / Estructuras
        tarjeta_profesional:
          type: string
          example: IC-456789-CND
    MaquinariaActaDto:
      type: object
      properties:
        tipo:
          type: string
          example: Excavadora de Orugas
        referencia:
          type: string
          example: CAT 320 GC
        cantidad:
          type: number
          example: 1
        estado:
          type: string
          example: Excelente
    EquipoActaDto:
      type: object
      properties:
        equipo:
          type: string
          example: Analizador de Energía
        descripcion:
          type: string
          example: Analizador de calidad de energía trifásico
        certificado_calibracion:
          type: string
          example: CERT-CAL-2026-8891
        codigo_referencia:
          type: string
          example: EQ-FLUKE-1736
    DatosActaInicioDto:
      type: object
      properties:
        fecha_inicio:
          type: string
          example: '2026-02-15'
          description: Fecha de inicio de ejecución
        fecha_terminacion:
          type: string
          example: '2026-12-15'
          description: Fecha de terminación. Si no se envía se calcula con el plazo
        fecha_suscripcion:
          type: string
          example: '2026-02-15'
          description: Fecha de suscripción del acta. Por defecto, la fecha actual
        numero_acta:
          type: string
          example: ACT-005-2026
        ciudad:
          type: string
          example: Bogotá D.C.
        valor_anticipo:
          type: number
          example: 360000000
        valor_disponibilidad:
          type: number
          example: 45000000
        valor_registro:
          type: number
          example: 45000000
        localizacion_proyecto:
          type: string
          example: Sede Tecnológica - Bogotá D.C.
        nombre_interventor:
          type: string
          example: Interventorías Globales Ltda.
        ciudad_expedicion_supervisor:
          type: string
          example: Medellín
        nombre_facultad:
          type: string
          description: >-
            Facultad donde se ejecuta el contrato (compraventa). Si no se envía,
            se toma la dependencia del lugar de ejecución
          example: Ingeniería
        variables:
          type: object
          description: >-
            Otras variables de plantilla a sobrescribir (clave: nombre de la
            variable)
          example: &ref_2
            nombre_supervisor: María Fernanda Restrepo
        personal_directivo:
          type: array
          items:
            $ref: '#/components/schemas/PersonaActaDto'
        personal_operativo:
          type: array
          items:
            $ref: '#/components/schemas/PersonaActaDto'
        maquinaria_equipo:
          type: array
          items:
            $ref: '#/components/schemas/MaquinariaActaDto'
        equipos:
          type: array
          items:
            $ref: '#/components/schemas/EquipoActaDto'
    GenerarActaInicioDto:
      type: object
      properties:
        fecha_inicio:
          type: string
          example: '2026-02-15'
          description: Fecha de inicio de ejecución
        fecha_terminacion:
          type: string
          example: '2026-12-15'
          description: Fecha de terminación. Si no se envía se calcula con el plazo
        fecha_suscripcion:
          type: string
          example: '2026-02-15'
          description: Fecha de suscripción del acta. Por defecto, la fecha actual
        numero_acta:
          type: string
          example: ACT-005-2026
        ciudad:
          type: string
          example: Bogotá D.C.
        valor_anticipo:
          type: number
          example: 360000000
        valor_disponibilidad:
          type: number
          example: 45000000
        valor_registro:
          type: number
          example: 45000000
        localizacion_proyecto:
          type: string
          example: Sede Tecnológica - Bogotá D.C.
        nombre_interventor:
          type: string
          example: Interventorías Globales Ltda.
        ciudad_expedicion_supervisor:
          type: string
          example: Medellín
        nombre_facultad:
          type: string
          description: >-
            Facultad donde se ejecuta el contrato (compraventa). Si no se envía,
            se toma la dependencia del lugar de ejecución
          example: Ingeniería
        variables:
          type: object
          description: >-
            Otras variables de plantilla a sobrescribir (clave: nombre de la
            variable)
          example: *ref_2
        personal_directivo:
          type: array
          items:
            $ref: '#/components/schemas/PersonaActaDto'
        personal_operativo:
          type: array
          items:
            $ref: '#/components/schemas/PersonaActaDto'
        maquinaria_equipo:
          type: array
          items:
            $ref: '#/components/schemas/MaquinariaActaDto'
        equipos:
          type: array
          items:
            $ref: '#/components/schemas/EquipoActaDto'
        usuario_id:
          type: number
          example: 1
          description: Id del usuario que genera el acta
        usuario_rol:
          type: string
          example: ABOGADO_CONTRATACION_RECTOR
          description: Rol del usuario que genera el acta
        descripcion:
          type: string
          example: Acta de inicio del contrato
      required:
        - usuario_id
        - usuario_rol
